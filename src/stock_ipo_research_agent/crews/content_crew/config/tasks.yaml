source_discovery_task:
  description: >
    Use the search tool to find the official sources for {company}:
    its latest annual report, its investor relations page, and its
    exchange filings pages. Use at most 3 searches.
    Select only URLs that appear in the search results, copied exactly.
    Do NOT invent or change a URL. Do NOT state any financial figures,
    dates or labels.
  expected_output: >
    A list of the selected URLs (urls), and a list of the things you could
    not find, such as "latest annual report" (not_found).
  agent: company_researcher