source_discovery_task:
  description: >
    Use the search tool to find the official sources for {company}.
    Use at most 3 searches, in this order:
    1. The latest annual report PDF. Search for the company name, "annual report",
    the latest financial year and "pdf", preferring nseindia.com and bseindia.com.
    2. The investor relations page.
    3. Only if something is still missing: the exchange filings page.
    If any search result is a direct PDF link to the latest annual report, you MUST
    include that exact URL in your answer.
    Select only URLs that appear in the search results, copied exactly.
    Do NOT invent or change a URL. Do NOT state any financial figures,
    dates or labels.
  expected_output: >
    A list of the selected URLs (urls), and a list of the things you could
    not find, such as "latest annual report" (not_found).
  agent: company_researcher

pick_report_task:
  description: >
    From the sources selected in the previous task, pick the URL of the latest
    annual report PDF for {company}, copied exactly. If none of them is an
    annual report PDF, set report_url to null. Do NOT state any figures.
  expected_output: >
    report_url: the exact URL you picked, or null.
  agent: report_picker
